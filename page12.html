<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <title> الأمية المهنية 2 للعاديين</title>
 <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
        }
        
        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: relative; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #4089BA;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #81c6ff; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
    



/* تنسيق المهن */
.jobs-section { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 20px; 
    width: 100%; 
    padding: 10px;
}
.jobs-row { 
    display: flex; 
    justify-content: center; 
    gap: 20px; 
    width: 100%; 
    flex-wrap: wrap; 
}
.job-card { 
    width: 220px; /* زيادة العرض */
    padding: 30px; 
    border-radius: 25px; 
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid #4089BA; 
    transition: all 0.3s ease;
}
.job-card:hover { transform: scale(1.05); border-color: #81c6ff; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
.job-icon { font-size: 70px; margin-bottom: 15px;text-align: center;  } /* أيقونات أكبر */
h3 { font-size: 33px; color: #333; text-align: center; font-weight: bolder; }
/* Modal التصميم */
.modal { 
   display: none; position: fixed; z-index: 3000; left: 0; top: 0; 
    width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7);
    justify-content: center; align-items: center;
}
.modal-content { 
    background: white; 
    padding: 40px; 
    width: 90%; 
    max-width: 600px; 
    border-radius: 30px; 
    text-align: center;
    /* هذا الجزء هو الأهم للتمركز */
    margin: auto; 
}
#modalTitle { font-size: 40px !important; color: #4089BA; margin-bottom: 30px; }
.step-item { 
    display: flex; align-items: center; gap: 20px;
    font-size: 28px !important; /* خط كبير جداً */
    padding: 25px !important; 
    margin: 20px !important; 
    border: 4px solid #4089BA !important;
    border-radius: 20px; background: #f9f9f9;
}
.step-number { 
   background: #4089BA; color: white; 
    width: 60px; height: 60px; /* دائرة أكبر */
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: bold;
}


.step-item:hover { background: #e3f2fd !important; }
#resultMessage { font-size: 30px !important; margin-top: 30px !important; }

/* تنسيق الأزرار لتكون ضخمة وواضحة */
.action-btn {
    width: 100%;           /* تأخذ عرض النافذة بالكامل لسهولة الضغط */
    max-width: 250px;      /* عرض أقصى لضمان الشكل الجمالي */
    padding: 25px !important; 
    font-size: 28px !important; 
    font-weight: bold; 
    border-radius: 20px !important; 
    margin: 15px 0 !important; 
    cursor: pointer;
    border: none;
    transition: transform 0.2s, background 0.3s;
}

.check-btn { background: #27ae60 !important; color: white !important; }
.close-btn { background: #e74c3c !important; color: white !important; }

/* تأثير عند الضغط */
.action-btn:active { transform: scale(0.95); }

.header-banner {
    margin-top: 30px;
    margin-bottom: 20px;
    padding: 15px 50px;
    background: rgba(255, 255, 255, 0.2);
    border: 3px solid #4089BA;
    border-radius: 35px;
    box-shadow: 0 8px 32px 0 rgba(64, 137, 186, 0.3);
    backdrop-filter: blur(4px);
    display: inline-block;
}

.main-title {
    margin: 0;
    color: #4089BA;
    font-size: 2.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
}



            /* الشاشة الخضراء النهائية */
        #finish-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 204, 113, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: white; text-align: center;
            animation: fadeIn 0.5s ease;
        }
        #finish-screen h2 { font-size: 5rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
        #finish-screen p { font-size: 2rem; margin-bottom: 40px; }
        .nav-btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; background: white;
            color: #2ecc71; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .nav-btn:hover { transform: scale(1.1); background: #f0f0f0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

</style>
</head>
<body>
    <div class="image-1"><img src="1-images/number/b8.jpg" alt="خلفية"></div>

<div id="finish-screen">
    <i class="fas fa-check-circle" style="font-size: 8rem; margin-bottom: 20px;"></i>
    <h2>أحسنت!</h2>
    <p>لقد انهيت جميع المستويات بنجاح</p>
<a href="2 page.html" style="text-decoration: none;">
        <button class="nav-btn">الانتقال للمسار التالي  <i class="fas fa-arrow-left"></i></button>
    </a></div>

<div class="top-bars-container">
    <div class="glass-bar tools-bar"> 
        <div class="accessibility-tools">
            <button class="size-btn" onclick="changeFontSize(1.3)">A+</button>
            <button class="size-btn" onclick="changeFontSize(1.0)">A</button>
            <button class="size-btn" onclick="changeFontSize(0.8)">A-</button>
        </div>
        <div class="search-box"><input type="text" placeholder="بحث..."><i class="fas fa-search"></i></div>
    </div>
    <div class="glass-bar logos-bar">
        <img src="1-images/اقرأ.png" alt="لوجو المبادرة" class="logo-mubadara">
        <img src="1-images/2.png" alt="لوجو الوزارة">
        <img src="1-images/1.png" alt="لوجو المشروع">
        <img src="1-images/LOGO.png" alt="لوجو الرابع" class="logo-4">
    </div>
</div>

<div class="header-banner">
    <h1 class="main-title">اختر المهنة وابدأ التحدي</h1>
</div>
<div class="jobs-section">
    <div class="jobs-section">
    <div class="jobs-row">
        <div class="job-card" onclick="openGame('السباكة')"><div class="job-icon">🛠️</div><h3>السباكة</h3></div>
        <div class="job-card" onclick="openGame('النجارة')"><div class="job-icon">🪑</div><h3>النجارة</h3></div>
        <div class="job-card" onclick="openGame('الكهرباء')"><div class="job-icon">💡</div><h3>الكهرباء</h3></div>
        <div class="job-card" onclick="openGame('المباني')"><div class="job-icon">🧱</div><h3>المباني</h3></div>
    </div>

    <div class="jobs-row">
        <div class="job-card" onclick="openGame('الحياكة')"><div class="job-icon">🧶</div><h3>الحياكة</h3></div>
        <div class="job-card" onclick="openGame('التطريز')"><div class="job-icon">🧵</div><h3>التطريز</h3></div>
        <div class="job-card" onclick="openGame('الكروشيه')"><div class="job-icon">🥢</div><h3>الكروشيه</h3></div>
        <div class="job-card" onclick="openGame('الصابون')"><div class="job-icon">🧼</div><h3>الصابون</h3></div>
    </div>
</div>

</div>
  <div id="gameModal" class="modal">
   <div class="modal-content">
    <h2 id="modalTitle" style="font-size: 35px; color: #4089BA;">رتب الخطوات</h2>
    <ul id="sortable-list" style="list-style: none; padding: 0;"></ul>
    
   <button class="action-btn check-btn" onclick="checkOrder()">تحقق من الإجابة</button>
<button class="action-btn close-btn" onclick="handleClose()">إغلاق</button>
    <div id="resultMessage" style="margin-top: 20px; font-size: 26px; font-weight: bold; padding: 15px; display: none;"></div>
</div>
</div>
<script>
    //الشريط 
      // اكواد الشريط العلوي ازرار التكبير والتصغير والتوسط
    function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }
const allJobs = {
    "السباكة": ["غلق محبس المياه", "فك الصنبور", "تركيب الجديد"],
    "النجارة": ["قياس الخشب", "قص الخشب", "تجميع الأجزاء"],
    "الكهرباء": ["فصل التيار", "تغيير المصابيح", "إعادة التشغيل"],
    "المباني": ["خلط الأسمنت والرمال", "وضع الطوب بالترتيب", "تنعيم الجدران بالملاط"],
    "الحياكة": ["رسم الباترون", "قص القماش", "خياطة الأطراف"],
    "التطريز": ["تثبيت القماش", "اختيار الخيوط", "الرسم بالخيط"],
    "الكروشيه": ["مسك الإبرة", "عمل عقدة البداية", "غرز السلسلة"],
    "الصابون": ["إذابة الزيوت", "إضافة العطر", "صب القالب"]
};

let selectedSteps = []; // لتخزين اختيارات المستخدم
let currentJobSteps = []; // لحفظ خطوات المهنة الحالية

function openGame(jobName) {
    const resultDiv = document.getElementById('resultMessage');
    if (resultDiv) resultDiv.style.display = "none";
    selectedSteps = [];
    currentJobSteps = allJobs[jobName];
    const list = document.getElementById('sortable-list');
    document.getElementById('modalTitle').innerText = "اختر الخطوات بالترتيب: " + jobName;
    list.innerHTML = "";
    
    // خلط الخطوات عشان ميبقوش بالترتيب
    const shuffled = [...currentJobSteps].sort(() => Math.random() - 0.5);
    
    shuffled.forEach((step) => {
        let li = document.createElement('li');
        li.className = "step-item";
        li.style.cursor = "pointer";
        li.innerHTML = `<span>${step}</span> <span class="badge" style="display:none; background:#27ae60; color:white; padding:5px 10px; border-radius:10px;"></span>`;
        
        li.onclick = function() {
            if (!selectedSteps.includes(step)) {
                selectedSteps.push(step);
                let badge = this.querySelector('.badge');
                badge.innerText = selectedSteps.length;
                badge.style.display = "inline-block";
                this.style.borderColor = "#27ae60";
            }
        };
        list.appendChild(li);
    });
    document.getElementById('gameModal').style.display = "flex";
}

function checkOrder() {
    const resultDiv = document.getElementById('resultMessage');
    resultDiv.style.display = "block"; // إظهار الرسالة

    if (selectedSteps.length !== currentJobSteps.length) {
        resultDiv.style.color = "#e67e22";
        resultDiv.innerText = "⚠️ من فضلك اختر جميع الخطوات بالترتيب!";
        return;
    }

    if (JSON.stringify(selectedSteps) === JSON.stringify(currentJobSteps)) {
        resultDiv.style.color = "#27ae60";
        resultDiv.innerText = "🎉 أحسنت! ترتيبك صحيح تماماً، أنت محترف!";
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
    } else {
        resultDiv.style.color = "#e74c3c";
        resultDiv.innerText = "⚠️ الترتيب غير صحيح. حاول مرة أخرى!";
    }
}

   
    function showFinishScreen() {
        // تشغيل صوت النجاح إذا كان الملف موجوداً
        new Audio('1-sounds/success.mp3').play().catch(()=>{ console.log("Sound file not found"); });
        
        // إظهار الشاشة الخضراء
        document.getElementById('finish-screen').style.display = 'flex';
        
        // تشغيل تأثير الاحتفال (الكونفيتي) لمدة 5 ثوانٍ
        var duration = 5 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 60 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random() * 0.2 + 0.1, y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random() * 0.2 + 0.7, y: Math.random() - 0.2 } }));
        }, 250);
    }
    function handleClose() {
    const modalTitle = document.getElementById('modalTitle').innerText;
    
    // إغلاق النافذة دائماً
    document.getElementById('gameModal').style.display = 'none';

    // التحقق إذا كانت المهنة هي الصابون
    if (modalTitle.includes("الصابون")) {
        showFinishScreen(); // استدعاء الشاشة الخضراء
    }
}
</script>


</body>
</html>
