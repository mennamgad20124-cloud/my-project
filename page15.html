<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
       <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <title>الأمية الأبجدية 2 لذوي الاحتياجات </title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
        }
    
        mark {
            background-color: #fef08a;
            padding: 2px 4px;
            border-radius: 4px;
        }


        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: relative; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #2C6799;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #99B3CA; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
   

.safe-touch-btn {
    /* مساحة الضغط الحقيقية كبيرة جداً */
    padding: 40px; 
    /* الزر الظاهري */
    background: #3d85b5;
    color: white;
    border: none;
    border-radius: 50px; /* حواف دائرية جداً لسهولة الانزلاق */
    font-size: 24px;
    cursor: pointer;
    transition: all 0.3s;
    /* إخفاء الـ padding لتبدو المساحة المحيطة شفافة */
    background-clip: padding-box;
    border: 10px solid transparent; 
}
/* حاوية الحروف (التي كانت ناقصة في كودك) */
  .alphabet-grid {
    display: flex;
    flex-direction: column; /* ترتيب العناصر تحت بعضها */
    gap: 20px;              /* مسافة أمان بين كل زر وآخر */
    width: 100%;            /* ملء الشاشة عرضياً */
    max-width: 1000px;
        /* لكي لا تكون الأزرار عريضة بشكل مبالغ فيه على التابلت */
    margin: 0 auto;
    min-height: 1600px;
}
/* الأزرار هنا أصبحت عريضة لتناسب اليد التي تعاني من ضعف الحركة */
.letter-btn {
        width:1200px;
        min-height: 500px; /* زيادة الارتفاع ليتسع للصورة والنص */
        display: flex;
        align-items: center;
        justify-content: space-between; /* الصورة في جهة والنص في جهة */
        padding: 20px 40px;
        background-color: #3d85b5;
        color: white;
        border: none;
        border-radius: 25px;
        margin-bottom: 20px;
        cursor: pointer;
        transition: 0.3s;
grid-template-columns: 1fr 2fr 2fr; /* تقسيم الزر لثلاثة أعمدة */  display: none;  }
/* مربع الحرف */
/* تنسيق المربعات الثلاثة */
.letter-btn.active {
    display: flex;
}
/* تنسيق أزرار التنقل */
.nav-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}
  .nav-btn {
            padding: 25px 60px;       /* زيادة المساحة حول النص ليصبح الزر أكبر */
    font-size: 40px; font-weight: bolder; background: #3d85b5;
            color: #ffffff; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .nav-btn:hover { transform: scale(1.1);    color: #3d85b5;background: #ffffff }
.letter-box {
    background-color: #ffffff;
   width: 200px;
    font-size: 170px;
    height: 400px;
     padding: 15px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #3d85b5;
    font-weight: bold;
}
.word-box { font-size: 170px;  height: 400px;   width: 450px; padding: 15px;
    border-radius: 15px;    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #3d85b5;
    font-weight: bold;
}
    .letter-content { display: flex; align-items: center; gap: 20px; }
    .letter-text { font-size: 80px; font-weight: bolder;color: #000; } /* تكبير الحرف */
    .word-text { font-size: 50px; } /* تكبير الكلمة */
    .letter-img { width: 350px; height: 400px; border-radius: 15px; object-fit: cover; }

        .letter-btn:hover { background-color: #3d85b5; color: white; }
        /* الشاشة الخضراء النهائية */
        #finish-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 204, 113, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: white; text-align: center;
            animation: fadeIn 0.5s ease;
        }
        #finish-screen h2 { font-size: 5rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
        #finish-screen p { font-size: 2rem; margin-bottom: 40px; }
       .nav-btns {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; background: white;
            color: #2ecc71; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .nav-btns:hover { transform: scale(1.1); background: #f0f0f0; }

.page-title { text-align: center; color: #174572; font-size: 50px; border-bottom: 4px solid #174572; padding-bottom: 5px; margin-bottom: 40px; }
   #audio-control:hover { transform: scale(1.1); transition: 0.3s; }

    const grid = document.getElementById('alphabet-grid');

   contentData.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.className = 'letter-btn';
    if (index === 0) btn.classList.add('active'); // عرض أول حرف فقط
    
    btn.innerHTML = `
        <div class="box letter-box">${item.letter}</div>
        <div class="box img-box"><img src="${item.img}" class="letter-img"></div>
        <div class="box word-box">${item.word}</div>
    `;
       
     btn.onclick = () => smartSpeak(item, btn);
    grid.appendChild(btn);
    buttons.push(btn);
});
// دوال التنقل
function showLetter(index) {
    buttons.forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });
}
function nextLetter() {
    // إذا لم نصل إلى آخر حرف، ننتقل للتالي
    if (currentIndex < buttons.length - 1) {
        currentIndex++;
        showLetter(currentIndex);
    } else {
        // هنا يمكنك إظهار شاشة النهاية أو رسالة "لقد انتهيت"
        document.getElementById('finish-screen').style.display = 'flex';
    }
}
function prevLetter() {
    // إذا لم نكن في أول حرف، ننتقل للسابق
    if (currentIndex > 0) {
        currentIndex--;
        showLetter(currentIndex);
    }
}
   // 2. دالة التفاعل العاطفي المحدثة
// 1. تعريف الأصوات عالمياً لتكون جاهزة دائماً
const clickAudio = new Audio("3-audios/4.mp4");
// 2. دالة التعامل مع مربعات الحروف
function smartSpeak(item, btnElement) {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]); 

    letterAudio.currentTime = 0;
    letterAudio.play().catch(e => console.log("خطأ في صوت الحرف:", e));

    btnElement.style.backgroundColor = "#2ecc71";
    btnElement.style.transform = "scale(0.95)";

    letterAudio.onended = () => {
        btnElement.style.backgroundColor = "#3d85b5";
        btnElement.style.transform = "scale(1)";
    };
}

// 3. دالة التعامل مع أزرار التنقل (المصححة)
function navButtonEffect(btnElement, moveFunction) {
    if (navigator.vibrate) navigator.vibrate(200); 

    clickAudio.currentTime = 0;
    clickAudio.play().catch(e => console.log("خطأ في صوت النقر:", e));

    setTimeout(() => {
        // تنفيذ الانتقال (التالي أو السابق)
        if (moveFunction) moveFunction();
        
        // ثم تلوين المربع الجديد الذي أصبح نشطاً الآن
        const currentSquare = buttons[currentIndex];
        if (currentSquare) {
            currentSquare.style.backgroundColor = "#2ecc71"; // اللون الأخضر
            currentSquare.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                currentSquare.style.backgroundColor = "#3d85b5"; // العودة للأزرق
                currentSquare.style.transform = "scale(1)";
            }, 300);
        }
    }, 100);
}
    function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }

   const audio = document.getElementById("myAudio");
const icon = document.getElementById("audio-icon");
let isPlaying = false;

function toggleAudio() {
    if (isPlaying) {
        audio.pause();
        icon.className = "fas fa-volume-mute";
    } else {
        audio.play().catch(e => alert("يرجى التأكد من مسار ملف الصوت"));
        icon.className = "fas fa-volume-up";
    }
    isPlaying = !isPlaying;
}
</script>
