<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <title>الأمية المهنية 1 لذوي الاحتياجات </title>

    <style>
              * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
            overflow: hidden;
        }
    
        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: fixed; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #30628e;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #c5e2fd; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
   
     .container {
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 20px #74bacd;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            text-align: center; 
            margin-top: 120px; /* مسافة 120 بكسل من الأعلى */
    margin-bottom: 40px; /* مسافة من الأسفل */
        }
      
        h1 {
            color: #007bff;
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: bolder;
        }
        p.subtitle, li.subtitle {
            color: #000000;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        li.subtitle {
            text-align: right;  
        }
        
        /* قسم التعرف على المايك لكبار السن */
        .apps-section {
            background-color: #f9f9f9;
            border: 2px dashed #007bff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .grid-apps {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .app-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,123,255,0.15);
        }
        .app-card img {
            width: 100px;
            height: 90px;
            margin-bottom: 10px;
            object-fit: contain;
        }
       
        .click-hint {
            font-size: 25px;
            color: #007bff;
            margin-top: 20px;
            display: block;
            font-weight: bold;
        }
         .desc-card-content {
            flex: 1;
            text-align: right;
        }
        .desc-card-title {
            font-size: 28px;
            color: #0b5ed7;
            font-weight: bold;
            margin-bottom: 5px;
            
        }
        .desc-card-text {
            font-size: 26px !important;        
            color: #2d3748 !important;
            font-weight: bold !important;
            margin: 0;
            line-height: 1.6;
        }
 mark {
            background-color: #fef08a;
            padding: 2px 4px;
            border-radius: 4px;
        }
   /* تأثير الإضاءة عند النطق */
.active-card {
    border: 5px solid #ffcc00 !important; 
    transform: scale(1.05);
    box-shadow: 0 0 20px #ffcc00 !important;
}
    </style>
</head>
<body>
 <div class="image-1"><img src="1-images/spcail/27.jpg" alt="خلفية"></div>

  <div class="container" role="main" aria-label="قسم أدوات المساعدة الرقمية">
   <p style="font-size: 26px;font-weight: bolder; color: #555; background: #eef; padding: 10px; border-radius: 10px; margin-top: 50px;">
    💡 <b>تلميح للمستخدم:</b> يمكنك تشغيل الدروس الصوتية بضغطة واحدة من لوحة المفاتيح.</p>
    <h1>الامية المهنية </h1>

    <p style="text-align: center; font-size: 20px;">
    </p>

    <div class="apps-section">
        <div class="grid-apps" style="display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
            
            <button class="app-card" onclick="playAudio('nvda', this)" aria-label="أداة إن في دي إيه، قارئ الشاشة المجاني، اضغط للاستماع للدرس">
                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 35px;font-weight: bolder;margin: 0 0 20px 0;"> مهارات يدوية/منزلية </h3>
                    <img src="1-images/spcail/67.jpg" alt="واتساب" style="  width: 250px; height: 180px;">
                    <span class="click-hint"><mark>  اضغط للاستماع الصوتي 🔊</mark></span>
                   
                </div>
            </button>

            <button class="app-card" onclick="playAudio('narrator', this)" aria-label="أداة الراوي، قارئ الشاشة المدمج في ويندوز، اضغط للاستماع للدرس">
                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 35px;font-weight: bolder;margin: 0 0 20px 0;">  مهارات تقنية </h3>
                    <img src="1-images/spcail/68.jpg" alt="واتساب" style="  width: 250px; height: 180px;">
                    <span class="click-hint"><mark>  اضغط للاستماع الصوتي 🔊</mark></span>
                </div>
            </button>

            <button class="app-card" onclick="playAudio('magnifier', this)" aria-label="أداة المكبر، لضعاف البصر، اضغط للاستماع للدرس">
                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 35px;font-weight: bolder;margin: 0 0 20px 0;"> مهارات حياتية </h3>
                    <img src="1-images/spcail/69.jpg" alt="واتساب" style="  width: 250px; height: 180px;">
                    <span class="click-hint"><mark>  اضغط للاستماع الصوتي 🔊</mark></span>
                </div>
            </button>

        </div>
    </div>
</div>
</div>

<div class="top-bars-container">
    <div class="glass-bar tools-bar"> 
        <div class="accessibility-tools">
            <button class="size-btn" onclick="changeFontSize(1.3)">A+</button>
            <button class="size-btn" onclick="changeFontSize(1.0)">A</button>
            <button class="size-btn" onclick="changeFontSize(0.8)">A-</button>
        </div>
        <div class="search-box"><input type="text" placeholder="بحث..."><i class="fas fa-search"></i></div>
    </div>
    <div class="glass-bar logos-bar">
        <img src="1-images/اقرأ.png" alt="لوجو المبادرة" class="logo-mubadara">
        <img src="1-images/2.png" alt="لوجو الوزارة">
        <img src="1-images/1.png" alt="لوجو المشروع">
        <img src="1-images/LOGO.png" alt="لوجو الرابع" class="logo-4">
    </div>
</div>

<script>
  function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }
let currentAudio = null;
let isPlaying = false; // هذا هو "القفل" الذي سيمنع تشغيل تطبيقات أخرى
    const audioPaths = {
        'nvda': '3-audios/15.mp3',      // غيري اسم الملف ده حسب ملفك الحقيقي
        'narrator': '3-audios/16.mp3',  // غيري الاسم حسب ملفك
        'magnifier': '3-audios/17.mp3' // غيري الاسم حسب ملفك
    };

 function playAudio(appId, element) {
        // إذا كان هناك صوت يعمل حالياً، نمنع الضغط على أي زر آخر
        if (isPlaying) {
            console.log("برجاء الانتظار حتى ينتهي الصوت الحالي");
            return; // الخروج من الدالة فوراً دون فعل شيء
        }

        // 1. تفعيل "القفل"
        isPlaying = true;

        // 2. إضاءة المربع الحالي
        element.classList.add('active-card');
        
        // 3. تشغيل الصوت
        currentAudio = new Audio(audioPaths[appId]); 
        currentAudio.play();
        
        // 4. عند انتهاء الصوت
        currentAudio.onended = function() {
            element.classList.remove('active-card');
            currentAudio = null;
            isPlaying = false; // فتح "القفل" ليسمح بتشغيل الدرس التالي
        };
    }
    document.addEventListener('keydown', function(event) {
        // نستخدم event.key للحصول على الرقم الذي ضغطه المستخدم
        const buttons = document.querySelectorAll('.app-card');
        
        if (event.key === '1') {
            playAudio('nvda', buttons[0]);
        } else if (event.key === '2') {
            playAudio('narrator', buttons[1]);
        } else if (event.key === '3') {
            playAudio('magnifier', buttons[2]);
        }
    });
</script>
</body>
</html>
