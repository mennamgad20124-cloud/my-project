<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <title>الأمية الرقمية 3 لذوي الاحتياجات </title>

    <style>
              * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
            overflow: hidden;
        }
    
        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: fixed; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #30628e;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #c5e2fd; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
   
     .container {
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 20px #74bacd;
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            text-align: center; 
            margin-top: 120px; /* مسافة 120 بكسل من الأعلى */
    margin-bottom: 40px; /* مسافة من الأسفل */
        }
      
        h1 {
            color: #007bff;
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: bolder;
        }
        p.subtitle, li.subtitle {
            color: #000000;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        li.subtitle {
            text-align: right;  
        }
        
        /* قسم التعرف على المايك لكبار السن */
        .apps-section {
            background-color: #f9f9f9;
            border: 2px dashed #007bff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .grid-apps {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .app-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            width: 410px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,123,255,0.15);
        }
        .app-card img {
            width: 100px;
            height: 90px;
            margin-bottom: 10px;
            object-fit: contain;
        }
       
        .click-hint {
            font-size: 25px;
            color: #007bff;
            margin-top: 20px;
            display: block;
            font-weight: bold;
        }
         .desc-card-content {
            flex: 1;
            text-align: right;
        }
        .desc-card-title {
            font-size: 28px;
            color: #0b5ed7;
            font-weight: bold;
            margin-bottom: 5px;
            
        }
        .desc-card-text {
            font-size: 26px !important;        
            color: #2d3748 !important;
            font-weight: bold !important;
            margin: 0;
            line-height: 1.6;
        }
 mark {
            background-color: #fef08a;
            padding: 2px 4px;
            border-radius: 4px;
        }
   /* تأثير الإضاءة عند النطق */
.active-card {
    border: 5px solid #ffcc00 !important; 
    transform: scale(1.05);
    box-shadow: 0 0 20px #ffcc00 !important;
}
    </style>
</head>
<body>
 <div class="image-1"><img src="1-images/spcail/100.jpg" alt="خلفية"></div>

  <div class="container" role="main" aria-label="قسم أدوات المساعدة الرقمية">
   
    <h1>الادوات الرقمية</h1>

    <p style="text-align: center; font-size: 20px;">
    </p>

    <div class="apps-section">
        <div class="grid-apps" style="display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
            
<button class="app-card" onclick="openModal( 
    'خطوات استخدام تطبيق الكتابة المباشرة من جوجل بلغة الاشارة',
    '',
    ['1-images/spcail/44.jpg', '1-images/spcail/45.png', '1-images/spcail/46.png', '1-images/spcail/47.png', '1-images/spcail/48.png', '1-images/spcail/49.png'], 
    3, 
    '2-videos/number/6.mp4'
)">
    <div class="card-content">
        <h3 style="color: #30628e; font-size: 30px;font-weight: bolder;margin: 0 0 20px 0;"> الكتابة المباشرة من جوجل <br> (Google Live Transcribe) </h3>
        <img src="1-images/spcail/41.png" alt="جوجل" style="width: 200px; height: 140px;">
        <span class="click-hint"><mark>الأفضل والأكثر دقة للغة حالياً.</mark></span>
    </div>
</button>
             
<button class="app-card" onclick="openModal(
    'خطوات استخدام مترجم مايكروسوفت بلغة الاشارة', 
    '', 
    ['1-images/spcail/50.png', '1-images/spcail/51.png', '1-images/spcail/52.png', '1-images/spcail/53.png'], 
    2 ,'2-videos/number/7.mp4'
)">              <div class="card-content">
                    <h3 style="color: #30628e; font-size: 30px;font-weight: bolder;margin: 0 0 20px 0;">  مترجم مايكروسوفت <br> (Microsoft Translator) </h3>
                    <img src="1-images/spcail/42.webp" alt="واتساب" style="  width: 200px; height: 140px;">
                    <span class="click-hint"><mark>   ميزة "المحادثة الجماعية". </mark></span>
                   
                </div>
            </button>
            
<button class="app-card" onclick="openModal(
    'خطوات استخدام تطبيق آفا (Ava) بلغة الاشارة', 
    '', 
    ['1-images/spcail/54.png'], 
    1,'2-videos/number/8.mp4'
)">                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 30px;font-weight: bolder;margin: 0 0 20px 0;">  تطبيق آفا <br> (Ava) </h3>
                    <img src="1-images/spcail/43.jpg" alt="واتساب" style="  width: 200px; height: 140px;">
                    <span class="click-hint"><mark>   الأكثر ذكاءً في "فصل" الأصوات. </mark></span>
                   
                </div>
            </button>
        </div>
    </div>
</div>
</div>
<div id="appModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; overflow-y: auto;">
    <div style="background:#fff; padding:30px; border-radius:20px; width:90%; max-width:1300px; text-align:center; position:relative; margin-top: 50px;">
        <span onclick="closeModal()" style="position:absolute; top:10px; left:20px; cursor:pointer; font-size:40px; font-weight:bold;">&times;</span>
        
        <h2 id="modalTitle" style="color:#007bff; font-size: 32px;"></h2>
        
        <p id="modalContentText" style="font-size: 24px; color: #333; margin: 20px 0;"></p>

        <div id="imageGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px;">
        </div>

        <button onclick="closeModal()" style="margin-top:25px; padding:10px 40px; background:#007bff; color:#fff; border:none; border-radius:10px; cursor:pointer; font-size:20px;">إغلاق</button>
    </div>
</div>
<div class="top-bars-container">
    <div class="glass-bar tools-bar"> 
        <div class="accessibility-tools">
            <button class="size-btn" onclick="changeFontSize(1.3)">A+</button>
            <button class="size-btn" onclick="changeFontSize(1.0)">A</button>
            <button class="size-btn" onclick="changeFontSize(0.8)">A-</button>
        </div>
        <div class="search-box"><input type="text" placeholder="بحث..."><i class="fas fa-search"></i></div>
    </div>
    <div class="glass-bar logos-bar">
        <img src="1-images/اقرأ.png" alt="لوجو المبادرة" class="logo-mubadara">
        <img src="1-images/2.png" alt="لوجو الوزارة">
        <img src="1-images/1.png" alt="لوجو المشروع">
        <img src="1-images/LOGO.png" alt="لوجو الرابع" class="logo-4">
    </div>
</div>

<script>
  function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }
function openModal(title, text, imagePaths, columns = 3, videoUrl = null) {
    document.getElementById('modalTitle').innerText = title;
    
    // 1. إعداد النص
    const textElement = document.getElementById('modalContentText');
    textElement.style.display = (text && text.length > 0) ? 'block' : 'none';
    textElement.innerText = text;
    
    const grid = document.getElementById('imageGrid');
    grid.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
    grid.style.display = 'grid'; // <--- أضفنا هذا السطر لضمان ظهور الصور دائماً
    grid.innerHTML = ''; 

    // 2. إزالة أي فيديو قديم موجود في النافذة
    const existingVideo = document.getElementById('modalVideo');
    if (existingVideo) {
        existingVideo.remove();
    }

    // 3. إضافة حاوية الفيديو الجديد (إذا وُجد)
    if (videoUrl) {
        const video = document.createElement('video');
        video.id = 'modalVideo';
        video.src = videoUrl;
        video.controls = true;
        video.style.width = '100%';
        video.style.marginBottom = '20px';
        video.style.borderRadius = '15px';
        video.style.display = 'block';
        
        // إخفاء الصور مؤقتاً طالما الفيديو موجود
        grid.style.display = 'none'; 
        grid.parentNode.insertBefore(video, grid);
        
       video.onended = () => {
            video.remove(); // حذف الفيديو من الصفحة تماماً
            grid.style.display = 'grid'; // إظهار الصور
        };
    }
    
    // 4. إضافة الصور
    if (imagePaths && Array.isArray(imagePaths)) {
        imagePaths.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.style.width = '100%';
            img.style.borderRadius = '10px';
            grid.appendChild(img);
        });
    }
    
    document.getElementById('appModal').style.display = 'flex';
}
function closeModal() {
    document.getElementById('appModal').style.display = 'none';
    const video = document.getElementById('modalVideo');
    if (video) {
        video.pause(); // إيقاف الفيديو
        video.currentTime = 0; // إرجاعه للبداية
    }
}
</script>
</body>
</html>
