<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأمية الأبجدية 1 لذوي الاحتياجات </title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
            overflow: hidden; /* هذا هو السطر المسؤول عن إخفاء السكرول */
        }
    
        mark {
            background-color: #fef08a;
            padding: 2px 4px;
            border-radius: 4px;
        }


        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: relative; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #2C6799;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #99B3CA; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
   


  .container {
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 20px #74bacd;
            padding: 30px;
            max-width: 1150px;
            width: 100%;
            text-align: center;
            height: 770px; 
        }

.visual-impairment-container {
        background-color: white;
        color: #FFD700;
        border: 2px solid #2C6799;
        border-radius: 30px;
        padding: 40px;
        text-align: center;
    }
    
    .visual-impairment-container h1 { color: #174572;font-size: 50px;display: inline-block;             /* لجعل الخط بعرض النص فقط */
    border-bottom: 4px solid #174572;  /* سمك ولون الخط */padding-bottom: 5px; }
    .visual-impairment-container .subtitle { color: #FFF; }

    .alphabet-grid {
       display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
        margin-top: 0px;
        padding: 20px;
    }

    .letter-btn {
      background-color: #99B3CA;
        color: white;
        border: 4px solid #2C6799;
        font-size: 53px; /* حجم مناسب لظهور 28 حرفاً معاً */
        font-weight: 900;
        padding: 20px;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    .letter-btn:hover, .letter-btn:active {
        background-color: white;
        color: #2C6799;
transform: scale(1.05);
}

        /* الشاشة الخضراء النهائية */
        #finish-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 204, 113, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: white; text-align: center;
            animation: fadeIn 0.5s ease;
        }
        #finish-screen h2 { font-size: 5rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
        #finish-screen p { font-size: 2rem; margin-bottom: 40px; }
        .nav-btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; background: white;
            color: #2ecc71; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .nav-btn:hover { transform: scale(1.1); background: #f0f0f0; }

    </style>
</head>
<body>
    <div class="image-1"><img src="1-images/spcail/9.jpg" alt="خلفية"></div>


<div id="finish-screen">
    <i class="fas fa-check-circle" style="font-size: 8rem; margin-bottom: 20px;"></i>
    <h2>أحسنت!</h2>
    <p>لقد أتممت تعلم جميع الحروف بنجاح</p>
    
    <a href="page6.html" style="text-decoration: none;">
        <button class="nav-btn">الانتقال للمستوى التالي <i class="fas fa-arrow-left"></i></button>
    </a>
</div>


<div class="top-bars-container">
    <div class="glass-bar tools-bar"> 
        <div class="accessibility-tools">
            <button class="size-btn" onclick="changeFontSize(1.3)">A+</button>
            <button class="size-btn" onclick="changeFontSize(1.0)">A</button>
            <button class="size-btn" onclick="changeFontSize(0.8)">A-</button>
        </div>
        <div class="search-box"><input type="text" placeholder="بحث..."><i class="fas fa-search"></i></div>
    </div>
    <div class="glass-bar logos-bar">
        <img src="1-images/اقرأ.png" alt="لوجو المبادرة" class="logo-mubadara">
        <img src="1-images/2.png" alt="لوجو الوزارة">
        <img src="1-images/1.png" alt="لوجو المشروع">
        <img src="1-images/LOGO.png" alt="لوجو الرابع" class="logo-4">
    </div>
</div>

    <div class="container visual-impairment-container" id="visual-impairment-section">
    <h1 >لوحة الحروف الأبجدية الناطقة</h1>

    <div class="alphabet-grid" id="alphabet-grid"></div>
</div>
</div>


<script>
const arabicLetters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];

    // 2. توليد الأزرار برمجياً
    const grid = document.getElementById('alphabet-grid');
    arabicLetters.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.innerText = letter;
        btn.setAttribute('aria-label', `حرف ${letter}`);
        
        // ربط اللمس والماوس بدالة النطق
        btn.onclick = () => speak(letter);
        btn.ontouchstart = () => { triggerHapticFeedback(); speak(letter); };
        
        grid.appendChild(btn);
    });
let audioQueue = []; // قائمة انتظار الأصوات
let isPlaying = false; // هل يوجد صوت يعمل حالياً؟
   function speak(letter) {
    // 1. خريطة لربط كل حرف بملف الصوت الخاص به
    const soundMap = {
        "أ": "3-audios/horof/1.mp3",
        "ب": "3-audios/horof/2.mp3",
        "ت": "3-audios/horof/3.mp3",
        "ث": "3-audios/horof/4.mp3",
        "ج": "3-audios/horof/5.mp3",
        "ح": "3-audios/horof/6.mp3",
        "خ": "3-audios/horof/7.mp3",
        "د": "3-audios/horof/8.mp3",
        "ذ": "3-audios/horof/9.mp3",
        "ر": "3-audios/horof/10.mp3",
        "ز": "3-audios/horof/11.mp3",
        "س": "3-audios/horof/12.mp3",
        "ش": "3-audios/horof/13.mp3",
        "ص": "3-audios/horof/14.mp3",
        "ض": "3-audios/horof/15.mp3",
        "ط": "3-audios/horof/16.mp3",
        "ظ": "3-audios/horof/17.mp3" ,    
        "ع": "3-audios/horof/18.mp3",
        "غ": "3-audios/horof/19.mp3",
        "ف": "3-audios/horof/20.mp3",
        "ق": "3-audios/horof/21.mp3",
        "ك": "3-audios/horof/22.mp3",
        "ل": "3-audios/horof/23.mp3",
        "م": "3-audios/horof/24.mp3",
        "ن": "3-audios/horof/25.mp3",
        "ه": "3-audios/horof/26.mp3",
        "و": "3-audios/horof/27.mp3",
        "ي": "3-audios/horof/28.mp3"
    



        // ... أكملي باقي الحروف بنفس الطريقة
    };
if (soundMap[letter]) {
        // إضافة الصوت إلى قائمة الانتظار
        audioQueue.push(soundMap[letter]);
        
        // إذا لم يكن هناك صوت يعمل حالياً، نبدأ تشغيل الطابور
        if (!isPlaying) {
            playNext();
        }
    } else {
        console.log("ملف الصوت غير موجود للحرف: " + letter);
    }
}

// دالة مسؤولة عن سحب الصوت من القائمة وتشغيله
function playNext() {
    if (audioQueue.length === 0) {
        isPlaying = false;
        return;
    }

    isPlaying = true;
    const nextAudio = new Audio(audioQueue.shift());
    
    // تشغيل الصوت
    nextAudio.play();

    // عندما ينتهي الصوت، نقوم باستدعاء الدالة نفسها لتشغيل الصوت التالي
    nextAudio.onended = () => {
        playNext();
    };
}

// دالة الاهتزاز (كما هي)
function triggerHapticFeedback() {
    if ("vibrate" in navigator) navigator.vibrate(200);
}

    function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }

   
</script>


</body>
</html>
