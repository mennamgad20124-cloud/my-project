<script>
  function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }


function openModal(title, imgSrc, contentHTML, alertVisible) {
    document.getElementById('modal-title').innerText = title;
    
    // نستخدم innerHTML لعرض القائمة التي سنرسلها
    document.getElementById('modal-text').innerHTML = contentHTML;
    
    document.getElementById('modal-alert').style.display = alertVisible ? 'block' : 'none';
    document.getElementById('mainModal').style.display = 'flex';
}
    function closeModal() {
        document.getElementById('mainModal').style.display = 'none';
    }
function triggerCard(cardId) {
    const card = document.getElementById(cardId);
    
    if (card) {
        // 1. إضافة تأثير الإضاءة
        card.classList.add('active-card');
        
        // 2. الانتظار ثانية واحدة
        setTimeout(() => {
            card.classList.remove('active-card');
            
            // 3. محاكاة الضغط على الزر الأصلي (سيفتح النافذة الخاصة به تلقائياً)
            card.click(); 
        }, 1000); 
    }
}

    
   const audio = document.getElementById("myAudio");
const icon = document.getElementById("audio-icon");
let isPlaying = false;

function toggleAudio() {
    if (isPlaying) {
        audio.pause();
        icon.className = "fas fa-volume-mute";
    } else {
        audio.play().catch(e => alert("يرجى التأكد من مسار ملف الصوت"));
        icon.className = "fas fa-volume-up";
    }
    isPlaying = !isPlaying;
}
</script>
