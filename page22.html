<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
         <title>الأمية الرقمية 4 لذوي الاحتياجات </title>

     <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
    <style>
              * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
            overflow: hidden;
        }
    
        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: fixed; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #30628e;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #c5e2fd; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
   
     .container {
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 20px #74bacd;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            text-align: center; 
            margin-top: 120px; /* مسافة 120 بكسل من الأعلى */
    margin-bottom: 40px; /* مسافة من الأسفل */
        }
      
        h1 {
            color: #007bff;
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: bolder;
        }
        p.subtitle, li.subtitle {
            color: #000000;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        li.subtitle {
            text-align: right;  
        }
        
        /* قسم التعرف على المايك لكبار السن */
        .apps-section {
            background-color: #f9f9f9;
            border: 2px dashed #007bff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .grid-apps {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .app-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,123,255,0.15);
        }
        .app-card img {
            width: 100px;
            height: 90px;
            margin-bottom: 10px;
            object-fit: contain;
        }
       
        .click-hint {
            font-size: 25px;
            color: #007bff;
            margin-top: 20px;
            display: block;
            font-weight: bold;
        }
         .desc-card-content {
            flex: 1;
            text-align: right;
        }
        .desc-card-title {
            font-size: 28px;
            color: #0b5ed7;
            font-weight: bold;
            margin-bottom: 5px;
            
        }
        .desc-card-text {
            font-size: 26px !important;        
            color: #2d3748 !important;
            font-weight: bold !important;
            margin: 0;
            line-height: 1.6;
        }
 mark {
            background-color: #fef08a;
            padding: 2px 4px;
            border-radius: 4px;
        }
   /* تأثير الإضاءة عند النطق */
.active-card {
    border: 5px solid #ffcc00 !important; 
    transform: scale(1.05);
    box-shadow: 0 0 20px #ffcc00 !important;
}
   #audio-control:hover { transform: scale(1.1); transition: 0.3s; }

    </style>
</head>
<body>
 <div class="image-1"><img src="1-images/spcail/101.jpg" alt="خلفية"></div>

  <div class="container" role="main" aria-label="قسم أدوات المساعدة الرقمية">
  
    <h1>الادوات الرقمية</h1>

    <p style="text-align: center; font-size: 20px;">
    </p>

    <div class="apps-section">
        <div class="grid-apps" style="display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
            
            <button class="app-card" onclick="openModal('nvda', this)" aria-label="أداة إن في دي إيه، قارئ الشاشة المجاني، اضغط للاستماع للدرس">
                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 35px;font-weight: bolder;margin: 0 0 20px 0;"> أنا أتعلم هاتفي </h3>
                    <img src="1-images/spcail/55.png" alt="واتساب" style="  width: 250px; height: 180px;">
                    <p style="color: #000000; font-size: 30px;font-weight: bold;margin: 0 0 15px 0;"> أساسيات الجهاز </p>
                    <span class="click-hint"><mark>  اضغط للدخول</mark></span>
                   
                </div>
            </button>

            <button class="app-card" onclick="openModal('narrator', this)" aria-label="أداة الراوي، قارئ الشاشة المدمج في ويندوز، اضغط للاستماع للدرس">
                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 35px;font-weight: bolder;margin: 0 0 20px 0;"> التواصل الآمن </h3>
                    <img src="1-images/spcail/56.png" alt="واتساب" style="  width: 250px; height: 180px;">
                    <p style="color: #000000; font-size: 30px;font-weight: bold;margin: 0 0 15px 0;"> الجانب الاجتماعي</p>
                    <span class="click-hint"><mark>  اضغط للدخول</mark></span>
                </div>
            </button>

            <button class="app-card" onclick="openModal('magnifier', this)" aria-label="أداة المكبر، لضعاف البصر، اضغط للاستماع للدرس">
                <div class="card-content">
                    <h3 style="color: #30628e; font-size: 35px;font-weight: bolder;margin: 0 0 20px 0;"> المساعدة </h3>
                    <img src="1-images/spcail/57.png" alt="واتساب" style="  width: 250px; height: 180px;">
                    <p style="color: #000000; font-size: 30px;font-weight: bold;margin: 0 0 15px 0;">الجانب الوظيفي</p>
                    <span class="click-hint"><mark>  اضغط للدخول</mark></span>
                </div>
            </button>

        </div>
    </div>
</div>
</div>

<div class="top-bars-container">
    <div class="glass-bar tools-bar"> 
        <div class="accessibility-tools">
            <button class="size-btn" onclick="changeFontSize(1.3)">A+</button>
            <button class="size-btn" onclick="changeFontSize(1.0)">A</button>
            <button class="size-btn" onclick="changeFontSize(0.8)">A-</button>
        </div>
        <div class="search-box"><input type="text" placeholder="بحث..."><i class="fas fa-search"></i></div>
    </div>
    <div class="glass-bar logos-bar">
        <img src="1-images/اقرأ.png" alt="لوجو المبادرة" class="logo-mubadara">
        <img src="1-images/2.png" alt="لوجو الوزارة">
        <img src="1-images/1.png" alt="لوجو المشروع">
        <img src="1-images/LOGO.png" alt="لوجو الرابع" class="logo-4">
    </div>
</div>
<div id="lessonModal" style="display:none; position:fixed; top:0; left:0; width: 100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; width: 40%; max-height: 80vh; overflow-y: auto; padding: 40px; border-radius: 30px; text-align:center; position:relative; border: 5px solid #007bff;">
        <button onclick="closeModal()" style="position:absolute; top:10px; right:20px; font-size:40px; border:none; background:none; cursor:pointer;">&times;</button>
        <h2 id="modalTitle" style="color:#30628e; font-size: 45px;"></h2>
        <div id="modalContent" style="font-size: 28px; line-height: 1.8; margin: 20px 0;"></div>
    </div>
</div>

<div id="audio-control" onclick="toggleAudio()" style="position: fixed; top: 20px; right: 20px; z-index: 10000; cursor: pointer; background: white; padding: 15px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2);margin-right: 1600px;margin-top: 150px;">
    <i id="audio-icon" class="fas fa-volume-mute" style="font-size: 64px; color: #00568d;"></i>
</div>

<audio id="myAudio" loop>
    <source src="3-audios/14.mp3" type="audio/mpeg">
</audio>

<script>
  function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }


// وظيفة تغيير حجم الخط (باستخدام rem للتحكم الأفضل)
    function changeFontSize(multiplier) {
        document.body.style.fontSize = (16 * multiplier) + "px";
    }

    // وظيفة الضغط على الكروت مع إظهار أثر بصري (Feedback)
    function playAudio(id, element) {
        // إزالة التحديد عن أي كرت سابق
        document.querySelectorAll('.app-card').forEach(card => card.classList.remove('active-card'));
        
        // إضافة تأثير التحديد للكرت الحالي
        element.classList.add('active-card');
        
        // إضافة صوت أو رسالة (هنا للتوضيح)
        console.log("تم اختيار: " + id);
        
        // هنا يمكنك إضافة كود تشغيل الصوت الفعلي لاحقاً
        // setTimeout(() => { alert("جاري الانتقال لدرس: " + id); }, 500);
    }
const lessons = {
    'nvda': {
        title: 'أنا أتعلم هاتفي',
        steps: [
            { img: '1-images/spcail/58.jpeg', text: '1. ضع إصبعك في أسفل الشاشة' },
            { img: '1-images/spcail/59.jpeg', text: '2. اسحب للأعلى ببطء' },
            { img: '1-images/spcail/60.jpeg', text: '3. مبروك! هاتفك مفتوح' }
        ]
    },
    'narrator': {
    title: 'دليل التطبيقات (خريطة الأيقونات)',
    steps: [
        { img: '1-images/spcail/61.jpeg',  text: 'اللون الأخضر: للرسائل مع الأهل والأحباب' },
        { img: '1-images/spcail/62.jpeg',  text: 'اللون الأزرق: لإجراء مكالمة هاتفية مباشرة' },
        { img: '1-images/spcail/63.jpeg', text: 'اللون الأصفر: لالتقاط صور للذكرى الجميلة'  }
    ]
    },
   'magnifier': {
    title: 'المساعدة والأوامر الصوتية',
    steps: [
        { img: '1-images/spcail/64.jpeg',  text: '1. اضغط على زر المايك الملون بالأسفل'  },
        {  img: '1-images/spcail/65.jpeg', text: '2. انتظر حتى ترى الدائرة تنبض وتتحرك'  },
        {   img: '1-images/spcail/66.jpeg',  text: '3. قُل اسم الشخص بوضوح (مثلاً: أحمد)' }
    ]
}
};
let currentStep = 0;
let activeLessonId = '';

function openModal(id, element) {
    // 1. إضافة تأثير التحديد
    document.querySelectorAll('.app-card').forEach(card => card.classList.remove('active-card'));
    if(element) element.classList.add('active-card');

    // 2. ضبط المتغيرات
    activeLessonId = id;
    currentStep = 0;
    
    // 3. عرض العنوان وفتح النافذة
    document.getElementById('modalTitle').innerText = lessons[id].title;
    renderStep();
    document.getElementById('lessonModal').style.display = 'flex';
}

function renderStep() {
    const lesson = lessons[activeLessonId];
    const step = lesson.steps[currentStep];
    
    const content = `
        <img src="${step.img}" style="width: 550px; border-radius: 20px; border: 4px solid #007bff;">
      <div style="
            background-color: #f0f7ff; 
            border: 2px solid #30628e; 
            border-radius: 50px; 
padding: 5px 10px;       /* تم تصغير الـ padding العلوي والسفلي من 20 إلى 10 */            margin: 15px auto; 
            width: 85%; 
            box-shadow: 0 4px 10px rgba(48, 98, 142, 0.2);
        ">
        <p style="font-size: 30px; font-weight: bolder; margin: 20px 0;">${step.text}</p>
      </div>
        <div style="margin-top: 20px;">
   ${currentStep > 0 ? 
    `<button onclick="prevStep()" style="
        padding: 15px 40px; 
        border-radius: 50px; 
        font-size: 22px; 
        margin: 10px; 
        cursor: pointer; 
        border: 2px solid #30628e; 
        background: #ffffff; 
        color: #30628e; 
        font-weight: bold;
        transition: 0.3s;
    ">السابق</button>` : ''}

${currentStep < lesson.steps.length - 1 ? 
    `<button onclick="nextStep()" style="
        padding: 15px 50px; 
        border-radius: 50px; 
        font-size: 25px; 
        margin: 10px; 
        cursor: pointer; 
        border: none; 
        background: linear-gradient(135deg, #007bff, #0056b3); 
        color: white; 
        font-weight: bold;
        box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
        transition: 0.3s;
    ">التالي</button>` : ''} </div>
    `;
    document.getElementById('modalContent').innerHTML = content;

    
}

function nextStep() { currentStep++; renderStep(); }
function prevStep() { currentStep--; renderStep(); }

function closeModal() {
    document.getElementById('lessonModal').style.display = 'none';
}
  
   const audio = document.getElementById("myAudio");
const icon = document.getElementById("audio-icon");
let isPlaying = false;

function toggleAudio() {
    if (isPlaying) {
        audio.pause();
        icon.className = "fas fa-volume-mute";
    } else {
        audio.play().catch(e => alert("يرجى التأكد من مسار ملف الصوت"));
        icon.className = "fas fa-volume-up";
    }
    isPlaying = !isPlaying;
}
</script>
</body>
</html>
