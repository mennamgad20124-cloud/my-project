<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> الأمية المهنية 1 للعاديين</title>
 <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            counter-reset: step-counter;
        }
        
        /* التنسيقات العامة للحاويات الخارجية */
        .top-bars-container { 
            position: relative; 
            top: 20px; 
            width: 100%; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 2000;
            margin-bottom: 40px;
        }
        .glass-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); height: 70px; min-width: 350px; padding: 0 10px; border-radius: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 20px; border: 2px solid #2c3e50;}
        .logos-bar img { height: 45px; width: auto; object-fit: contain;} 
        .logo-mubadara, .logo-4 { height: 60px !important; }
        
        .search-box { display: flex; align-items: center; background: #f0f2f5; border-radius: 25px; padding: 5px 15px;}
        .search-box input { border: none; outline: none; font-family: 'Cairo'; font-size: 14px; width: 100px; background: transparent; }
        .accessibility-tools { display: flex; gap: 10px; align-items: center; }
        .size-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #91B4CF; color: #ffffff; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  
        .image-1 { position: fixed;  top: 0; left: 0;  width: 100%; height: 100%;  z-index: -1; }
        .image-1 img { width: 100%; height: 100%; object-fit: cover;  }
    


  .jobs-grid {
    display: grid;
    /* جعلها 4 أعمدة في الصف */
display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        width: 100%;
  }
.main-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start; /* لضبط التساوي في الطول */
        width: 100%;
        max-width: 1200px; /* تحديد عرض أقصى لعدم التشتت */
        gap: 30px;
        margin-top: 20px;
        padding: 10px;
    }
.side-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.section-title {
    font-size: 35px;
    font-weight: 900;
    color: #ffffff;
    margin-bottom: 30px;
    text-align: center;
    background: linear-gradient(90deg, #74bacd, #2c3e50);
    padding: 15px 50px;
    border-radius: 50px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
  .job-card {
   background: rgba(255, 255, 255, 0.85);
        border: none;
        border-radius: 35px;
        padding: 20px;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        cursor: pointer;
        backdrop-filter: blur(10px);
        margin: 10px;
        width: 200px;
     }
     .job-card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        background: #ffffff;
    }

.job-icon {
        font-size: 80px;
        margin-bottom: 15px;
        display: block;
    }
.job-title {
        color: #2c3e50;
        font-size: 30px;
        font-weight: bolder;
        margin-bottom: 5px;
        text-transform: uppercase;
    }
      .job-desc { font-size: 14px; color: #666; }
  /* زر التفاعل */
  .details-btn {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* الفاصل الكرييتف */
.center-separator {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 40px;
}


.center-separator::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 60%;
    background: linear-gradient(to bottom, #74bacd, #c3cfe2, transparent);
    z-index: 1;
}
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); 
    backdrop-filter: blur(12px); 
    z-index: 9999; 
    justify-content: center; 
    align-items: center;
}
.modal-content {
    background: #ffffff; 
    padding: 50px; 
    border-radius: 50px; 
    width: 90%; 
    max-width: 800px;
    text-align: center; 
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    animation: popUp 0.4s ease-out;
}
    @keyframes popUp {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

/* تكبير الصورة لتكون واضحة */
.modal-content img {
    width: 95% !important; 
    height: 330px !important; 
    object-fit: cover;
    border-radius: 40px;
    margin-bottom: 30px;
}
.modal-content h2 { font-size: 55px !important; margin: 10px 0; color: #2c3e50; }
.modal-content p { 
    font-size: 30px !important; 
    color: #444; 
    line-height: 1.6;
    margin: 15px 0;
}
#modalTitle { 
    font-size: 65px !important; 
    color: #2c3e50; 
    font-weight: 900; 
    margin-bottom: 25px;
    /* لمسة كرييتف للعنوان */
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    background: linear-gradient(to right, #74bacd, #2c3e50);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
}.close-btn { 
    position: absolute; 
    top: 20px; 
    left: 40px; 
    font-size: 60px; 
    cursor: pointer; 
    color: #ff4d4d;
}

.info-box {
    background: #f8f9fa; /* لون خلفية هادئ للمربع */
    padding: 20px;
    border-radius: 20px;
    margin: 15px 0;
    text-align: right; /* جعل النص يبدأ من اليمين بشكل مريح */
    border-right: 6px solid #74bacd; /* خط جانبي للتجميل */
}

.info-box strong {
    display: block;
    font-size: 32px;
    color: #2c3e50;
    margin-bottom: 10px;
}

.info-box p {
    font-size: 30px !important;
    color: #000000 !important;
    margin: 0 !important;
}
</style>
</head>
<body>
    <div class="image-1"><img src="1-images/number/b6.jpg" alt="خلفية"></div>

<div class="top-bars-container">
    <div class="glass-bar tools-bar"> 
        <div class="accessibility-tools">
            <button class="size-btn" onclick="changeFontSize(1.3)">A+</button>
            <button class="size-btn" onclick="changeFontSize(1.0)">A</button>
            <button class="size-btn" onclick="changeFontSize(0.8)">A-</button>
        </div>
        <div class="search-box"><input type="text" placeholder="بحث..."><i class="fas fa-search"></i></div>
    </div>
    <div class="glass-bar logos-bar">
        <img src="1-images/اقرأ.png" alt="لوجو المبادرة" class="logo-mubadara">
        <img src="1-images/2.png" alt="لوجو الوزارة">
        <img src="1-images/1.png" alt="لوجو المشروع">
        <img src="1-images/LOGO.png" alt="لوجو الرابع" class="logo-4">
    </div>
</div>
<div class="main-wrapper">
    <div class="side-section">
        <div class="section-title">مهن الرجال</div>
        <div class="jobs-grid">
<div class="job-card" onclick="openModal('النجارة', '1-images/number/14.jpeg', 'تلمس يدك الخشب وتشكله بصبر وتركيز.', 'تجديد أثاث بيتك وتنمية صبرك وتركيزك.')">     
       <div class="job-icon">🪑</div><div class="job-title">النجارة</div>
    </div>
    <div class="job-card" onclick="openModal('السباكة', '1-images/number/15.avif', 'تركيب وصيانة المواسير والصنابير.', 'حل مشاكل تسريب المياه وتوفيرها.')">
        <div class="job-icon">🛠️</div><div class="job-title">السباكة</div>
    </div>
    <div class="job-card" onclick="openModal('الكهرباء', '1-images/number/16.jpg', 'فحص الأسلاك وتغيير المصابيح.', 'تأمين المنزل وتوفير الإضاءة.')">
        <div class="job-icon">💡</div><div class="job-title">الكهرباء</div>
    </div> 
     <div class="job-card" onclick="openModal('المباني', '1-images/number/17.webp', 'أعمال البناء والترميم المنزلي.', 'تقوية بيتك والحفاظ على سلامة الجدران.')">
    <div class="job-icon">🧱</div>
    <div class="job-title">المباني</div>
</div>

<div class="job-card" onclick="openModal('حدادة', '1-images/number/18.jpg', 'تشكيل الحديد وإصلاح الأقفال والشبابيك.', 'توفير حماية وأمان إضافي لمنزلك.')">
    <div class="job-icon">⛓️</div>
    <div class="job-title">حدادة</div>
</div>

<div class="job-card" onclick="openModal('تعبئة', '1-images/number/19.jpg', 'فرز المحاصيل وتجهيزها للتخزين.', 'حفظ بركة الرزق وتجهيز مونة بيتك.')">
    <div class="job-icon">🌾</div>
    <div class="job-title">تعبئة</div>
</div> </div>
    </div>

    <div class="center-separator"></div>

    <div class="side-section">
        <div class="section-title">مهن السيدات</div>
        <div class="jobs-grid">
        <div class="job-card" onclick="openModal('الحياكة', '1-images/number/20.jpg', 'غزل ووصل الأقمشة بالإبرة والخيط بعناية.', 'توفير ملابس الأسرة وتنمية مهاراتك اليدوية.')">
    <div class="job-icon">🧶</div><div class="job-title">الحياكة</div>
</div>

<div class="job-card" onclick="openModal('التطريز', '1-images/number/21.jpg', 'الرسم بالخيوط الملونة على القماش.', 'تجميل ملابسك وإضافة لمسة فنية لمفروشات بيتك.')">
    <div class="job-icon">🧵</div><div class="job-title">التطريز</div>
</div>

<div class="job-card" onclick="openModal('الخوص', '1-images/number/22.jpg', 'جدل جريد النخل لصناعة أطباق وسلال.', 'صناعة منتجات طبيعية مفيدة ومستدامة.')">
    <div class="job-icon">🧺</div><div class="job-title">الخوص</div>
</div>

<div class="job-card" onclick="openModal('صابون', '1-images/number/23.jpg', 'خلط الزيوت الطبيعية والعطور لصناعة الصابون.', 'منتج صحي وآمن لنظافة بيتك وعائلتك.')">
    <div class="job-icon">🧼</div><div class="job-title">صابون</div>
</div>

<div class="job-card" onclick="openModal('تغليف', '1-images/number/24.webp', 'تنسيق وتغليف الهدايا والمناسبات بجمال.', 'إسعاد من تحبين بلمسة فنية مميزة.')">
    <div class="job-icon">🎁</div><div class="job-title">تغليف</div>
</div>

<div class="job-card" onclick="openModal('تغليف', '1-images/number/24.webp', 'تنسيق وتغليف الهدايا والمناسبات بجمال.', 'إسعاد من تحبين بلمسة فنية مميزة.')">
    <div class="job-icon">
        🥢</div><div class="job-title">كروشيه</div>
</div>

   
</div>
<div id="jobModal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <h2 id="modalTitle">

            
        </h2>
        <img id="modalImg" src="" alt="المهنة">
        <div class="info-box">
            <strong>💡 طريقة العمل:-</strong>
            <p id="modalWork"></p>
        </div>
        
        <div class="info-box" style="background: #f0f7f9;">
            <strong>🌟 لماذا هذه المهنة:-</strong>
            <p id="modalImportance"></p>
        </div>
    </div>
</div>
<script>
    //الشريط 
      // اكواد الشريط العلوي ازرار التكبير والتصغير والتوسط
    function changeFontSize(size) { 
        document.body.style.zoom = size; 
        if (size > 1) {
            document.body.style.width = (size * 100) + "%";
            document.body.style.position = "relative";
            document.documentElement.style.overflowX = 'auto';
        } else {
            document.body.style.width = "100%";
            document.documentElement.style.overflowX = 'hidden';
        }
    }
const careers = [
  { 
    name: "الخياطة والتطريز", 
    type: "handy", 
    img: "1-images/sewing.png", // ضعي مسار صورتك هنا
    tools: "إبر، خيوط، أقمشة ملونة", 
    output: "ملابس تفصيل، مفروشات بيتية", 
    benefit: "توفير احتياجات البيت ودخل إضافي من الجيران." 
  },
  // يمكنك إضافة مهن أخرى بنفس الطريقة
];

function filterCareers(type) {
  const grid = document.getElementById('career-grid');
  grid.innerHTML = ""; 
  
  careers.filter(c => c.type === type).forEach(c => {
    grid.innerHTML += `
      <div class="career-card">
        <div class="career-img"><img src="${c.img}" style="width:70px;"></div>
        <h4>${c.name}</h4>
        <div class="career-info">
          <p><strong>الأدوات:</strong> ${c.tools}</p>
          <p><strong>ماذا سأقدم؟:</strong> ${c.output}</p>
          <p><strong>لماذا هذه المهنة؟:</strong> ${c.benefit}</p>
        </div>
      </div>
    `;
  });
}
// تعديل بسيط في الدالة لعرض المهنة المختارة
function showDetails(type) {
  const grid = document.getElementById('details-area');
  grid.innerHTML = ""; 
  
  const selected = careers.find(c => c.type === type);
  if(selected) {
    grid.innerHTML = `
      <div class="career-card">
        <div class="career-img"><img src="${selected.img}" style="width:70px;"></div>
        <h4>${selected.name}</h4>
        <div class="career-info">
          <p><strong>الأدوات:</strong> ${selected.tools}</p>
          <p><strong>ماذا سأقدم؟:</strong> ${selected.output}</p>
          <p><strong>لماذا هذه المهنة؟:</strong> ${selected.benefit}</p>
        </div>
      </div>
    `;
  } else {
    grid.innerHTML = "<p>قريباً سنضيف المزيد من المهن في هذا المسار!</p>";
  }
}

function openModal(title, imgPath, work, importance) {
        // تحديث العنوان
        document.getElementById('modalTitle').innerText = title;
        // تحديث الصورة
        document.getElementById('modalImg').src = imgPath;
        // تحديث الشرح
        document.getElementById('modalWork').innerText = work;
        document.getElementById('modalImportance').innerText = importance;
        
        document.getElementById('jobModal').style.display = 'flex';
    }
    function closeModal() {
    document.getElementById('jobModal').style.display = 'none';
}
</script>


</body>
</html>
